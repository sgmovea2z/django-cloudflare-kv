[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-cloudflare-kv-example"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["django-cloudflare-kv", "django>=5.2,<6.2"]

[dependency-groups]
dev = ["workers-py>=1.17.6"]

[tool.uv.sources]
django-cloudflare-kv = { path = "../../dist/django_cloudflare_kv-0.1.0-py3-none-any.whl", editable = false }

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]
