[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-cloudflare-kv"
version = "0.1.0"
description = "Django cache backend for native Cloudflare Workers KV bindings"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["Django>=5.2,<6.2"]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "django-stubs>=5.2",
    "hypothesis>=6.140",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "workers-py>=1.17.6",
    "workers-runtime-sdk>=1.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_cloudflare_kv"]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
include = [
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/src/django_cloudflare_kv/**",
    "/tests/**",
]
exclude = [
    # Agent instructions are workspace harness state, not library source.
    "/.agents/**",
    # Codegraph database/link is local indexing state, not source.
    "/.codegraph",
    # OMO plans and evidence are local orchestration state, not source.
    "/.omo/**",
    # Node dependencies are generated workspace dependencies, not Python source.
    "/node_modules/**",
    # Local Python environments contain generated interpreter/dependency files.
    "/.venv*/**",
    # Hypothesis database is generated test cache state.
    "/.hypothesis/**",
    # pytest and Ruff caches are local generated tool state.
    "/.pytest_cache/**",
    "/.ruff_cache/**",
    # Build artifacts are outputs, not inputs to a source distribution.
    "/dist/**",
    "/build/**",
    # Worker venv contains generated runtime dependencies, not contract tests.
    "/tests/integration/worker/.venv-workers/**",
    # Worker Python modules are generated dependency copies, not source.
    "/tests/integration/worker/python_modules/**",
    # Wrangler state is generated by local Worker builds and tests.
    "/tests/integration/worker/.wrangler/**",
    # Python bytecode/cache directories are generated and platform-specific.
    "**/__pycache__/**",
    # Finder metadata is local filesystem state, not source.
    "**/.DS_Store",
    # Editor and language-server caches are generated workspace state.
    "/.serena/**",
    "/.vscode/**",
    "/.idea/**",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", ".venv-workers", "python_modules", ".wrangler"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "strict"
filterwarnings = ["error"]
markers = [
    "integration: requires a local Worker/KV runtime",
    "runtime_gate: verifies real Workers Python runtime behavior",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["**/.venv-workers/**", "**/python_modules/**", "**/.wrangler/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "TD002", "TD003", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"tests/integration/test_runtime_gate.py" = ["INP001", "S310", "S603", "S607"]
"tests/integration/runtime_gate_support.py" = ["INP001", "S310", "S603", "S607"]
"tests/integration/conftest.py" = ["S603"]
"tests/integration/test_wheel_consumer.py" = ["S603", "S607", "TC003"]
"tests/integration/worker/worker.py" = ["INP001", "TC003", "B009", "BLE001", "PLR0911", "PLC0415", "PT017"]
"tests/integration/worker/consumer_routes.py" = ["INP001", "PLC0415", "S106", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/.venv-workers/**", "**/python_modules/**", "**/.wrangler/**", "tests/integration/worker/**", "**/build", "**/dist"]
